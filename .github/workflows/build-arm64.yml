name: Build ARM64 Debs

on:
  workflow_dispatch:

env:
  INDI_3RDPARTY_VERSION: 2.2.3.1
  INDI_CORE_VERSION: 2.2.3.1

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
      options: --user root

    steps:
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      - name: Checkout Build Scripts (This Repo)
        uses: actions/checkout@v4
        with:
          path: scripts_repo

      - name: Clone Upstream INDI 3rd Party (v${{ env.INDI_3RDPARTY_VERSION }})
        run: |
          git clone --depth 1 --branch v${{ env.INDI_3RDPARTY_VERSION }} https://github.com/indilib/indi-3rdparty.git indi-source

      - name: Prepare Build Directory
        run: |
          cp scripts_repo/build_debs.sh indi-source/
          chmod +x indi-source/build_debs.sh

      - name: Setup Sources for Build Dependencies
        run: |
          if ! sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources; then
            sed -i '/^deb /p; s/^deb /deb-src /' /etc/apt/sources.list
          fi
          apt-get update

      - name: Install Build Dependencies
        run: |
          apt-get install -y \
            build-essential \
            cmake \
            debhelper \
            devscripts \
            fakeroot \
            pkg-config \
            curl \
            gnupg \
            lsb-release \
            dpkg-dev \
            sudo \
            cdbs \
            equivs \
            python3

          apt-get install -y \
            libcfitsio-dev \
            libnova-dev \
            libusb-1.0-0-dev \
            libcurl4-gnutls-dev \
            libgsl-dev \
            libjpeg-dev \
            libfftw3-dev \
            libczmq-dev \
            libftdi1-dev \
            libgpiod-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavformat-dev \
            libswscale-dev \
            libgps-dev \
            libraw-dev \
            libdc1394-dev \
            libgphoto2-dev \
            libboost-all-dev \
            libopencv-dev \
            libzmq3-dev \
            libudev-dev \
            liblimesuite-dev \
            libhidapi-dev \
            libev-dev \
            libgtest-dev \
            libgmock-dev \
            zlib1g-dev \
            nlohmann-json3-dev

      - name: Ensure pigpio headers are available
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y python3-setuptools python3-full wget

          for pkg in libpigpiod-if-dev libpigpiod-if2-1 libpigpio-dev pigpio-tools libpigpiod libpigpio1; do
            if apt-get install -y "$pkg"; then
              echo "Installed optional package: $pkg"
            else
              echo "Optional package not available on this image: $pkg"
            fi
          done

          has_if2_header=0
          has_pigpio_header=0

          if [ -f /usr/include/pigpiod_if2.h ] || [ -f /usr/local/include/pigpiod_if2.h ]; then
            has_if2_header=1
          fi

          if [ -f /usr/include/pigpio.h ] || [ -f /usr/local/include/pigpio.h ]; then
            has_pigpio_header=1
          fi

          if [ "$has_if2_header" -eq 1 ] && [ "$has_pigpio_header" -eq 1 ]; then
            echo "pigpio headers already available from packages."
            exit 0
          fi

          cd /tmp
          wget -q https://github.com/joan2937/pigpio/archive/refs/tags/v79.tar.gz
          tar zxf v79.tar.gz
          cd pigpio-79
          make
          make install

          for hdr in pigpio.h pigpiod_if2.h pigpiod_if.h; do
            if [ -f "/usr/local/include/$hdr" ] && [ ! -f "/usr/include/$hdr" ]; then
              cp "/usr/local/include/$hdr" /usr/include/
            fi
          done

          ldconfig

          if [ ! -f /usr/include/pigpiod_if2.h ] && [ ! -f /usr/local/include/pigpiod_if2.h ]; then
            echo "pigpiod_if2.h is still missing after pigpio install" >&2
            exit 1
          fi

          if [ ! -f /usr/include/pigpio.h ] && [ ! -f /usr/local/include/pigpio.h ]; then
            echo "pigpio.h is still missing after pigpio install" >&2
            exit 1
          fi

      - name: Build and install INDI Core (v${{ env.INDI_CORE_VERSION }})
        run: |
          set -euo pipefail

          mkdir -p build/indi-core
          git clone --depth 1 --branch v${{ env.INDI_CORE_VERSION }} https://github.com/indilib/indi.git indi-core

          files="$(grep -RIl -- '-Werror' indi-core || true)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | while IFS= read -r f; do
              [ -n "$f" ] && sed -i 's/-Werror/-Wno-error/g' "$f"
            done
          fi

          cmake -S indi-core -B build/indi-core \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wno-error" \
            -DCMAKE_CXX_FLAGS="-Wno-error" \
            -DINDI_BUILD_QT5_CLIENT=OFF \
            -DINDI_BUILD_QT_CLIENT=OFF

          cmake --build build/indi-core --parallel "$(nproc)"
          cmake --install build/indi-core
          ldconfig

          mkdir -p /tmp/libindi-dev-equivs

          cat > /tmp/libindi-dev-equivs/control <<EOF
          Section: misc
          Priority: optional
          Standards-Version: 4.7.0

          Package: libindi-dev
          Version: ${{ env.INDI_CORE_VERSION }}
          Maintainer: GitHub Actions <actions@github.com>
          Architecture: all
          Description: Dummy libindi-dev package (CI)
           Dummy package to satisfy Build-Depends when INDI is built from source.
          EOF

          cd /tmp/libindi-dev-equivs
          equivs-build control
          dpkg -i libindi-dev_${{ env.INDI_CORE_VERSION }}_all.deb

      - name: Determine release metadata
        id: release_meta
        run: |
          set -euo pipefail

          release_tag="indi3rdparty-v${{ env.INDI_3RDPARTY_VERSION }}-${GITHUB_RUN_NUMBER}"
          release_name="INDI 3rdparty v${{ env.INDI_3RDPARTY_VERSION }} build ${GITHUB_RUN_NUMBER} Debian Trixie ARM64"

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Run Build Script
        working-directory: indi-source
        run: |
          set -euo pipefail
          ./build_debs.sh

      - name: Append run number to Debian package metadata and filenames
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          revision="${GITHUB_RUN_NUMBER}"

          debs=(indi-source/dist/*.deb)
          if (( ${#debs[@]} == 0 )); then
            echo "No .deb artifacts found in indi-source/dist" >&2
            exit 1
          fi

          work_root="$(mktemp -d)"
          map_file="$(mktemp)"

          echo "Collecting package version map..."

          for deb in "${debs[@]}"; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            old_ver="$(dpkg-deb -f "$deb" Version)"

            if [[ -z "$pkg" || -z "$old_ver" ]]; then
              echo "Could not read Package or Version from $deb" >&2
              exit 1
            fi

            if [[ "$old_ver" == *-* ]]; then
              new_ver="${old_ver}+tns${revision}"
            else
              new_ver="${old_ver}-${revision}"
            fi

            printf '%s\t%s\t%s\n' "$pkg" "$old_ver" "$new_ver" >> "$map_file"
            echo "  $pkg: $old_ver -> $new_ver"
          done

          echo "Repacking packages with updated metadata..."

          for deb in "${debs[@]}"; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            arch="$(dpkg-deb -f "$deb" Architecture)"
            old_ver="$(dpkg-deb -f "$deb" Version)"
            new_ver="$(awk -F '\t' -v p="$pkg" '$1 == p { print $3; exit }' "$map_file")"

            if [[ -z "$pkg" || -z "$arch" || -z "$old_ver" || -z "$new_ver" ]]; then
              echo "Could not determine package metadata for $deb" >&2
              exit 1
            fi

            work_dir="${work_root}/${pkg}"
            rm -rf "$work_dir"
            mkdir -p "$work_dir"

            dpkg-deb -R "$deb" "$work_dir"

            sed -i -E "s/^Version: .*/Version: ${new_ver}/" "$work_dir/DEBIAN/control"

            python3 - "$work_dir/DEBIAN/control" "$map_file" <<'PY'
            import re
            import sys
            from pathlib import Path

            control_path = Path(sys.argv[1])
            map_path = Path(sys.argv[2])

            mappings = []
            for line in map_path.read_text().splitlines():
              pkg, old_ver, new_ver = line.split("\t")
              mappings.append((pkg, old_ver, new_ver))

            text = control_path.read_text()

            for pkg, old_ver, new_ver in mappings:
              pattern = re.compile(
                rf"(\b{re.escape(pkg)}(?::[A-Za-z0-9-]+)?\s*\(\s*=\s*)"
                rf"{re.escape(old_ver)}"
                rf"(\s*\))"
              )
              text = pattern.sub(rf"\g<1>{new_ver}\g<2>", text)

            control_path.write_text(text)
            PY

            new_deb="indi-source/dist/${pkg}_${new_ver}_${arch}.deb"

            rm -f "$new_deb"
            dpkg-deb --root-owner-group -b "$work_dir" "$new_deb"

            rm -f "$deb"

            echo "Created: $(basename "$new_deb")"
            echo "  Internal version: $(dpkg-deb -f "$new_deb" Version)"
          done

          echo "Final package list:"
          ls -lh indi-source/dist/*.deb

      - name: Validate Debian package versions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          debs=(indi-source/dist/*.deb)
          if (( ${#debs[@]} == 0 )); then
            echo "No .deb artifacts found in indi-source/dist" >&2
            exit 1
          fi

          for deb in "${debs[@]}"; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            ver="$(dpkg-deb -f "$deb" Version)"
            arch="$(dpkg-deb -f "$deb" Architecture)"
            expected="${pkg}_${ver}_${arch}.deb"

            echo "$(basename "$deb") -> Package=$pkg Version=$ver Architecture=$arch"

            if [[ "$(basename "$deb")" != "$expected" ]]; then
              echo "Filename does not match internal metadata." >&2
              echo "Expected: $expected" >&2
              exit 1
            fi

            if [[ "$ver" != *"-${GITHUB_RUN_NUMBER}" && "$ver" != *"+tns${GITHUB_RUN_NUMBER}" ]]; then
              echo "Version does not contain this GitHub run number." >&2
              echo "Version: $ver" >&2
              echo "Run number: ${GITHUB_RUN_NUMBER}" >&2
              exit 1
            fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indi-3rdparty-arm64-debs
          path: indi-source/dist/*.deb

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          files: indi-source/dist/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}